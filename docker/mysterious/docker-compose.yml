services:
  mysterious-influxdb:
    container_name: mysterious-influxdb
    image: 100zz/test-influxdb:${INFLUXDB_VERSION}
    restart: always
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: admin123
      DOCKER_INFLUXDB_INIT_ORG: mysterious_org
      DOCKER_INFLUXDB_INIT_BUCKET: jmeter
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: mysterious_admin_token
    ports:
      - "12003:2003"
      - "18086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-conf:/etc/influxdb2

  mysterious-grafana:
    # http://localhost:13000/d/mysterious/jmeter-dashboard?orgId=1&refresh=5s&from=now-1h&to=now&kiosk&fullscreen
    container_name: mysterious-grafana
    image: 100zz/test-grafana:${GRAFANA_VERSION}
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    ports:
      - "13000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - grafana-provisioning:/etc/grafana/provisioning
    depends_on:
      - mysterious-influxdb

  mysterious-mysql:
    container_name: mysterious-mysql
    image: 100zz/test-mysql:${MYSQL_VERSION}
    restart: always
    command: --max-connections=1000 --slow_query_log=1 --slow_query_log_file=/var/lib/mysql/slow-log.log --long_query_time=1
    volumes:
      - mysql-data:/var/lib/mysql
      - mysql-sql:/docker-entrypoint-initdb.d
    environment:
      MYSQL_ROOT_PASSWORD: Test@123456
      MYSQL_DATABASE: mysterious
      TZ: Asia/Shanghai
      LANG: C.UTF-8
    ports:
      - "23306:3306"

  mysterious-redis:
    container_name: mysterious-redis
    image: 100zz/test-redis:${REDIS_VERSION}
    restart: always
    environment:
      TZ: Asia/Shanghai
    volumes:
      - redis-data:/data
      - redis-logs:/logs
      - redis-conf:/etc/redis
    sysctls:
      - net.core.somaxconn=1024
    ports:
      - "16379:6379"
    privileged: true
    command: >
      bash -c "echo 'vm.overcommit_memory = 1' >> /etc/sysctl.conf && redis-server /etc/redis/redis.conf"

  mysterious-nginx:
    container_name: mysterious-nginx
    image: 100zz/test-nginx:${NGINX_VERSION}
    restart: always
    environment:
      TZ: Asia/Shanghai
    volumes:
      - nginx-conf:/etc/nginx/conf.d
      - nginx-html:/usr/share/nginx/html
      - mysterious-data:/opt/mysterious/mysterious-data
    ports:
      - "1234:1234"
      - "9998:9998"

  mysterious:
    container_name: mysterious
    image: 100zz/mysterious:${MYSTERIOUS_VERSION}
    restart: always
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: -Xmx1G -Xms1G
      SERVER_PORT: 4321
      SPRING_DATASOURCE_DRUID_URL: jdbc:mysql://mysterious-mysql:3306/mysterious?allowMultiQueries=true&useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_DRUID_USERNAME: root
      SPRING_DATASOURCE_DRUID_PASSWORD: Test@123456
      SPRING_DATASOURCE_DRUID_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 100MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 100MB
      SPRING_REDIS_HOST: mysterious-redis
    volumes:
      - mysterious-logs:/opt/logs
      - mysterious-jmeter:/opt/mysterious/mysterious-jmeter
      - mysterious-data:/opt/mysterious/mysterious-data
      - mysterious-jmx:/opt/mysterious/mysterious-jmx
    ports:
      - "4321:4321"
    depends_on:
      - mysterious-mysql
      - mysterious-nginx
      - mysterious-redis

volumes:
  # 新增：InfluxDB 2.x 核心数据卷（对应 /var/lib/influxdbv2）
  influxdb-data:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: ${PWD}/influxdb/data  # 主机目录，需手动创建
    labels:
      description: "InfluxDB 2.x 核心数据目录（bolt/sqlite）"
      service: "mysterious-influxdb"

  influxdb-conf:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: ${PWD}/influxdb/conf  # 主机目录，需手动创建
    labels:
      description: "InfluxDB 2.x 配置目录（influx-configs）"
      service: "mysterious-influxdb"

  grafana-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/grafana/data
    labels:
      description: "Grafana 数据存储目录"
      service: "mysterious-grafana"

  grafana-provisioning:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/grafana/provisioning
    labels:
      description: "Grafana 数据源目录"
      service: "mysterious-grafana"

  mysql-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/mysql/data
    labels:
      description: "MySQL 数据存储目录"
      service: "mysterious-mysql"

  mysql-sql:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/mysql/sql
    labels:
      description: "MySQL 初始化 SQL 脚本目录"
      service: "mysterious-mysql"

  redis-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/redis/data
    labels:
      description: "Redis 数据存储目录"
      service: "mysterious-redis"

  redis-logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/redis/logs
    labels:
      description: "Redis 日志文件目录"
      service: "mysterious-redis"

  redis-conf:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/redis/conf
    labels:
      description: "Redis 配置文件目录"
      service: "mysterious-redis"

  nginx-conf:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/nginx/conf.d
    labels:
      description: "Nginx 配置文件目录"
      service: "mysterious-nginx"

  nginx-html:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/nginx/html
    labels:
      description: "Nginx 静态 HTML 文件目录"
      service: "mysterious-nginx"

  mysterious-logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/logs
    labels:
      description: "Mysterious 应用日志目录"
      service: "mysterious"

  mysterious-jmeter:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/mysterious-jmeter
    labels:
      description: "Mysterious 关联的 JMeter 文件目录"
      service: "mysterious"

  mysterious-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/mysterious-data
    labels:
      description: "Mysterious 应用数据存储目录"
      service: "mysterious"

  mysterious-jmx:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/mysterious-jmx
    labels:
      description: "Mysterious 关联的 JMX 脚本目录"
      service: "mysterious"
